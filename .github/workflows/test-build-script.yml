name: Test Evolution X myron Build Script (Lightweight)

on:
  workflow_dispatch:

jobs:
  test-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies + repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core curl python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          repo --version

      - name: Test repo init + K90PM local manifest
        run: |
          set -e
          mkdir -p test-aosp && cd test-aosp

          echo "===== 1. 测试 repo init (Evolution-X cnb) ====="
          repo init -u https://github.com/Evolution-X/manifest -b cnb --git-lfs --depth=1 --no-repo-verify

          echo "===== 2. 添加 K90PM-Development local manifest ====="
          mkdir -p .repo/local_manifests
          curl -L -o .repo/local_manifests/myron.xml \
            https://raw.githubusercontent.com/K90PM-Development/Releases/main/build_evolution.xml

          echo "===== 3. 检查 local manifest 内容 ====="
          echo "----- myron.xml 内容 -----"
          cat .repo/local_manifests/myron.xml
          echo "--------------------------"

          echo "===== 4. 验证关键项目是否存在于 manifest ====="
          # 检查几个最重要的仓库是否被正确声明
          grep -q "device/xiaomi/myron" .repo/local_manifests/myron.xml && echo "✅ device/xiaomi/myron 存在"
          grep -q "device/xiaomi/sm8850-common" .repo/local_manifests/myron.xml && echo "✅ sm8850-common 存在"
          grep -q "kernel/xiaomi/myron-prebuilt" .repo/local_manifests/myron.xml && echo "✅ prebuilt kernel 存在"
          grep -q "K90PM-Development" .repo/local_manifests/myron.xml && echo "✅ K90PM-Development 仓库引用正常"

          echo "===== 5. 测试只同步 manifest 本身 ====="
          repo sync -c --no-tags --no-clone-bundle -j$(nproc) .repo/manifests || true

          echo "===== 6. 显示最终 local_manifests 状态 ====="
          ls -la .repo/local_manifests/

          echo ""
          echo "✅ 轻量验证全部完成！"
          echo "repo init + K90PM local_manifest 下载与检查均正常。"
          echo "可以放心去 Crave 跑完整编译了。"
